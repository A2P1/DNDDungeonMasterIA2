<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNGEON & DRAGONS: UN DUNGEON MASTER DE INTELIGENCIA ARTIFICIAL</title>
</head>
<body>
    <style>
        body {
            font-family: Arial, sans-serif;
            
            padding: 20px;
        }
        .contenedor-inventario {
            margin-top: 20px;
            align-items: center;
        }
        #narration {
            width: 50%;
            height: 500px;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #fff;
            font-size: 16px;
            line-height: 1.5;

        }
        #prompt-input {
            width: 50%;
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
            
        }
        .contenedor_principal {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
        }
        .contenedor {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .imagen {
            width: 400px;
        }
        .texto {
            flex: 1;
            margin-top: 10px;
        }
    </style>
    <div class="contenedor_principal">
        <img src="http://localhost:8000/static/personaje.png" id="imagen1" class="imagen" style="display:none;" alt="">
        <textarea id="narration" readonly rows="10" cols="50" class="texto"></textarea><br>
        <img src="http://localhost:8000/static/mundo.png" id="imagen2" class="imagen" style="display:none;" alt="">
    </div>
    <div class="contenedor">
        <input type="text" id="prompt-input" placeholder="Escribe tu acción...">
        <button id="borrar-button">BORRAR PARTIDA</button>
        <textarea id="inventario" readonly rows="10" cols="50" class="texto"></textarea><br>
    </div>
        
    

    <script type="module" src="script.js"></script>
</body>
</html>
